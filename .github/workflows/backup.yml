name: Daily backup

# Production's own backup (architecture §9.3, §12 risk 4: Neon Free keeps 6 hours of restore
# history, we keep 30 days). `pg_dump` of `netnet-prod` — every schema — as owner, encrypted
# with `age` to BACKUP_PUBLIC_KEY, kept 30 days as an artifact. Restoring is `ops/backup.md`.
# The repository holds DATABASE_OWNER_URL (owner, direct, F7) and BACKUP_PUBLIC_KEY (F14).
# Dispatch by hand for a backup on demand (and the restore proof's source).
on:
  schedule:
    # Daily at 02:30 UTC, clear of the 01:00, 09:00 and 17:00 cron wakes.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Dump, encrypt, keep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `environment:` here on purpose: the `production` environment's required reviewer
    # would hold every scheduled run for approval. The backup's secrets are repository
    # secrets, so the schedule runs unattended.
    steps:
      - name: Install pg_dump and age
        env:
          DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client age curl ca-certificates gnupg
          # pg_dump refuses a server newer than itself (Neon runs 18, the runner's default
          # client is 16): install the client matching the server's major, from PGDG.
          major=$(psql "$DATABASE_OWNER_URL" -tAc \
            "select split_part(current_setting('server_version'), '.', 1)" | grep -o '^[0-9]\+')
          . /etc/os-release
          echo "deb http://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" |
            sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc |
            sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y "postgresql-client-$major"
          echo "PGDUMP=/usr/lib/postgresql/$major/bin/pg_dump" >> "$GITHUB_ENV"
      - name: Dump every schema and encrypt to the Founder's key
        id: dump
        env:
          DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
          BACKUP_PUBLIC_KEY: ${{ secrets.BACKUP_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_OWNER_URL" ] || [ -z "$BACKUP_PUBLIC_KEY" ]; then
            echo "::error::The production environment needs DATABASE_OWNER_URL and BACKUP_PUBLIC_KEY (F12, F14)."
            exit 1
          fi
          file="netnet-prod-$(date -u +%F).sql.age"
          "$PGDUMP" "$DATABASE_OWNER_URL" --no-owner --no-privileges | age -r "$BACKUP_PUBLIC_KEY" -o "$file"
          ls -la "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "Backup: $file ($(du -h "$file" | cut -f1))." >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the backup 30 days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: netnet-prod-backup
          path: ${{ steps.dump.outputs.file }}
          retention-days: 30
