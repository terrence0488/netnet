name: Metrics

# The Founder's metrics report (architecture §10, P4-T3): dispatch it with a window and it runs
# `ops/metrics/*.sql` as netnet_metrics, writing M1–M11, M13, the M10 funnel and the N1 SLO to the
# job summary. Read-only: it never migrates, writes or changes an account. No `environment:` key,
# so a dispatch never waits for a reviewer. The repository holds DATABASE_METRICS_URL (the
# netnet_metrics login) and METRICS_EXCLUDE_USERS (comma-separated usr_ ids, the probe account) as
# secrets (F24); the command prints aggregates only.
on:
  workflow_dispatch:
    inputs:
      from:
        description: 'First day, UTC (YYYY-MM-DD, inclusive)'
        required: true
        type: string
      to:
        description: 'Last day, UTC (YYYY-MM-DD, inclusive); empty means today'
        required: false
        type: string

permissions:
  contents: read

env:
  VERCEL_TELEMETRY_DISABLED: '1'

jobs:
  metrics:
    name: Print the metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run the metrics
        env:
          DATABASE_METRICS_URL: ${{ secrets.DATABASE_METRICS_URL }}
          METRICS_EXCLUDE_USERS: ${{ secrets.METRICS_EXCLUDE_USERS }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          set -euo pipefail
          args=(--env production --from "$FROM")
          if [ -n "$TO" ]; then args+=(--to "$TO"); fi
          pnpm --silent metrics "${args[@]}" | tee metrics.md
      - name: Write the tables to the job summary
        if: always()
        run: |
          if [ -s metrics.md ]; then
            cat metrics.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No metrics output.' >> "$GITHUB_STEP_SUMMARY"
          fi
