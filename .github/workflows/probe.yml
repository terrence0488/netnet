name: MCP probe

# The whole MCP path every 6 hours (architecture §9.3, §10): refresh, `tools/list` and
# `get_financial_context` on the probe account's one long-lived connection, each call logging
# its client-observed time next to the function's latency. The server rotates the refresh token,
# so the run writes it back to the PROBE_REFRESH_TOKEN secret. It never registers or authorizes:
# never a connection per run (each would send a security email and spend Resend's 100 a day).
# One-time setup and the cron timing log are `ops/probe.md` (F15).
on:
  schedule:
    # Every 6 hours. Hourly after Neon Launch (architecture §9.3).
    - cron: '23 */6 * * *'
  workflow_dispatch:

# Serialised with the deploy workflow's smoke tests: both rotate the same token.
concurrency:
  group: probe-refresh-token
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: Probe the MCP path
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No `environment:` here on purpose: the `production` environment's required reviewer
    # would hold every scheduled run for approval. The probe's secrets are repository
    # secrets, so the schedule runs unattended.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Probe
        id: probe
        env:
          PROBE_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          PROBE_CLIENT_ID: ${{ secrets.PROBE_CLIENT_ID }}
          PROBE_REFRESH_TOKEN: ${{ secrets.PROBE_REFRESH_TOKEN }}
        run: pnpm --silent probe --origin "$PROBE_ORIGIN"
      # Even a failed probe rotated the token (the script emits it right after refresh), so this
      # stores it whenever one was emitted — else the next probe is refused. The script masked
      # it before writing it to $GITHUB_OUTPUT, so this step's env shows `***`; it reaches the
      # script only through env, since an expression in `run:` is printed with the script.
      - name: Store the rotated token
        if: steps.probe.outputs.refresh_token != ''
        env:
          GH_TOKEN: ${{ secrets.PROBE_SECRETS_TOKEN }}
          REFRESH_TOKEN: ${{ steps.probe.outputs.refresh_token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The probe token rotated, but PROBE_SECRETS_TOKEN is not set: the next probe would fail. Set it (ops/probe.md) and re-run the one-time setup."
            exit 1
          fi
          gh secret set PROBE_REFRESH_TOKEN --body "$REFRESH_TOKEN"
