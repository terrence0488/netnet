<!doctype html><html><head><meta charset="utf-8"><title>NetNet palette options</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#5a5a5a;font-family:"Liberation Sans",Arial,sans-serif}
.pal{padding:26px}
.pal h2{color:#fff;font-size:21px;margin-bottom:3px;letter-spacing:-.02em}
.pal p{color:#d0d0d0;font-size:13px;margin-bottom:16px}
.pair{display:flex;gap:20px}
.phone{width:390px;border-radius:26px;overflow:hidden;position:relative}
.tag{position:absolute;top:0;left:0;right:0;text-align:center;font-size:10px;font-weight:700;
  letter-spacing:.14em;padding:5px;z-index:9;text-transform:uppercase}
.scr{padding:44px 16px 0;min-height:800px}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800}
.greet small{display:block;font-size:11.5px;opacity:.65}
.greet b{font-size:16px;letter-spacing:-.01em}
.ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:15px;opacity:.75}
.hero{border-radius:20px;padding:20px;margin-bottom:12px;position:relative;overflow:hidden}
.hero .lbl{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.75}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.035em;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.base{font-size:11.5px;opacity:.7;margin-top:9px}
.two{display:flex;gap:10px;margin-bottom:12px}
.mini{flex:1;border-radius:16px;padding:13px 14px}
.mini small{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.6;display:block}
.mini b{font-size:17px;font-weight:700;letter-spacing:-.02em;display:block;margin-top:4px;font-variant-numeric:tabular-nums}
.card{border-radius:18px;padding:16px;margin-bottom:12px}
.ch{display:flex;align-items:center;margin-bottom:12px}
.ch h3{font-size:15px;font-weight:700;letter-spacing:-.01em;flex:1}
.rng{display:flex;gap:4px;margin-top:10px;justify-content:center}
.rng span{font-size:11px;font-weight:700;padding:4px 9px;border-radius:7px;opacity:.5}
.rng span.on{opacity:1}
.alloc{display:flex;gap:14px;align-items:center}
.lg{flex:1}
.lgr{display:flex;align-items:center;gap:7px;font-size:12px;padding:3px 0}
.lgr i{width:9px;height:9px;border-radius:3px;display:block}
.lgr span{flex:1;opacity:.8}
.lgr b{font-weight:700;font-variant-numeric:tabular-nums;font-size:11.5px}
.rows{border-radius:18px;overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:11px;padding:13px 14px}
.row .nm{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:6px;letter-spacing:-.01em}
.row .sb{font-size:11.5px;opacity:.55;margin-top:2px}
.row .gr{flex:1;min-width:0}
.row .amt{text-align:right}
.row .amt b{font-size:14.5px;font-weight:700;display:block;font-variant-numeric:tabular-nums}
.row .amt s{font-size:11.5px;font-weight:700;text-decoration:none;font-variant-numeric:tabular-nums}
.chip{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase}
.cta{border-radius:14px;padding:14px;text-align:center;font-weight:800;font-size:15px;margin-bottom:14px;letter-spacing:-.01em}
.tabs{display:flex;padding:10px 0 16px;margin:0 -16px;border-top:1px solid}
.tb{flex:1;text-align:center;font-size:10px;font-weight:700}
.tb i{display:block;font-size:17px;font-style:normal;margin-bottom:2px}
</style></head><body><div id="out"></div>
<script>
/* categorical chart palette = the validated default from the dataviz reference,
   held CONSTANT across all four options so the comparison isolates the brand system */
const CAT_L=['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300'];
const CAT_D=['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300'];

const P={
A:{name:'A · Aqua on Slate',note:'Teal-aqua brand, cool slate neutrals. Fresh and modern, deliberately not bank-navy. Agent channel: violet.',
 dark:{bg:'#0B1013',s1:'#141A1E',s2:'#1E262B',ink:'#F2F6F7',i2:'#93A2AA',line:'#263036',br:'#14C8B8',brOn:'#04211E',brT:'#2DD4BF',pos:'#34D399',neg:'#FB7185',warn:'#FBBF24',warnBg:'#2A2410',ag:'#A78BFA',agBg:'#211B33',heroA:'#0E8F84',heroB:'#0B5F60'},
 light:{bg:'#EFF4F5',s1:'#FFFFFF',s2:'#E7EFF1',ink:'#0B1013',i2:'#556670',line:'#DDE6E9',br:'#0F766E',brOn:'#FFFFFF',brT:'#0F766E',pos:'#047857',neg:'#BE123C',warn:'#92400E',warnBg:'#FEF3C7',ag:'#6D28D9',agBg:'#EDE9FE',heroA:'#0D9488',heroB:'#0F766E'}},
B:{name:'B · Electric Blue on Graphite',note:'Vivid blue brand, graphite neutrals. The most familiar confident-fintech register — safest and most legible as a money app. Agent channel: violet.',
 dark:{bg:'#0B0D10',s1:'#15181D',s2:'#1F242B',ink:'#F5F7FA',i2:'#98A2B0',line:'#262C34',br:'#2563EB',brOn:'#FFFFFF',brT:'#60A5FA',pos:'#34D399',neg:'#FB7185',warn:'#FBBF24',warnBg:'#2A2410',ag:'#A78BFA',agBg:'#1F1B33',heroA:'#2563EB',heroB:'#1E3A8A'},
 light:{bg:'#F1F4F9',s1:'#FFFFFF',s2:'#E9EEF5',ink:'#0B0D10',i2:'#4F5A67',line:'#DFE5ED',br:'#2563EB',brOn:'#FFFFFF',brT:'#1D4ED8',pos:'#047857',neg:'#BE123C',warn:'#92400E',warnBg:'#FEF3C7',ag:'#6D28D9',agBg:'#EDE9FE',heroA:'#2563EB',heroB:'#1D4ED8'}},
C:{name:'C · Gold on Ink',note:'Warm gold brand on near-black ink. Premium and wealth-signalling, least like a startup. Costs you amber: warnings move to a cool blue "attention" colour. Agent channel: violet.',
 dark:{bg:'#0C0B09',s1:'#17150F',s2:'#221F17',ink:'#F8F5EE',i2:'#A69C88',line:'#2A2619',br:'#E5B045',brOn:'#241A05',brT:'#E5B045',pos:'#34D399',neg:'#FB7185',warn:'#7DD3FC',warnBg:'#0C2431',ag:'#A78BFA',agBg:'#211B33',heroA:'#B98A22',heroB:'#6B4E0E'},
 light:{bg:'#F6F2E8',s1:'#FFFFFF',s2:'#EFEADC',ink:'#1A1710',i2:'#5C5443',line:'#E4DECB',br:'#966D12',brOn:'#FFFFFF',brT:'#7C5A0F',pos:'#047857',neg:'#BE123C',warn:'#0369A1',warnBg:'#E0F2FE',ag:'#6D28D9',agBg:'#EDE9FE',heroA:'#A1761A',heroB:'#7A5710'}},
D:{name:'D · Violet on Midnight',note:'Violet brand on midnight neutrals. Boldest and most distinctive, closest to "new fintech". Because violet becomes the brand, the agent channel moves to cyan.',
 dark:{bg:'#0A0A14',s1:'#14141F',s2:'#1E1E2D',ink:'#F4F4FA',i2:'#9A9AB4',line:'#262639',br:'#7C3AED',brOn:'#FFFFFF',brT:'#B197FC',pos:'#34D399',neg:'#FB7185',warn:'#FBBF24',warnBg:'#2A2410',ag:'#22D3EE',agBg:'#0B2A31',heroA:'#7C3AED',heroB:'#4C1D95'},
 light:{bg:'#F3F2FA',s1:'#FFFFFF',s2:'#ECEBF5',ink:'#0A0A14',i2:'#51516A',line:'#E2E0EF',br:'#6D28D9',brOn:'#FFFFFF',brT:'#6D28D9',pos:'#047857',neg:'#BE123C',warn:'#92400E',warnBg:'#FEF3C7',ag:'#0E7490',agBg:'#CFFAFE',heroA:'#6D28D9',heroB:'#5B21B6'}}};

const TYPES=[['Stocks',41.2],['Property',27.4],['CPF',11.0],['Equity Comp',7.6],['Cash',6.9],['Crypto',5.9]];
const HOLD=[
 ['IBKR','Updated today','$798K','+7.98%',1,0,[3,5,4,7,6,9,8,12]],
 ['HDB flat — Punggol','Updated 4 months ago','$710K','+0.00%',0,0,[5,5,6,6,7,7,8,8]],
 ['CPF Ordinary','Updated 4 weeks ago','$117K','+2.18%',1,0,[4,5,5,6,6,7,7,8]],
 ['Toyota Corolla Altis','Updated 2 years ago','$126K','−0.00%',0,1,[9,8,7,6,5,4,4,3]],
 ['HDB loan','Updated 4 weeks ago','−$349K','+0.91%',0,0,[9,9,8,8,7,7,6,6]]];
const TREND=[18,22,20,27,25,31,29,36,34,41,39,44,48,46,54,58,56,64,68,74];

function spark(v,c){const mn=Math.min(...v),mx=Math.max(...v),sp=(mx-mn)||1;
 const d=v.map((y,i)=>(i?'L':'M')+(i/(v.length-1)*48+2).toFixed(1)+' '+(23-((y-mn)/sp)*20).toFixed(1)).join(' ');
 return `<svg width="52" height="26" viewBox="0 0 52 26"><path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function area(v,c){const mn=Math.min(...v),mx=Math.max(...v),sp=(mx-mn)||1;
 const pts=v.map((y,i)=>[(i/(v.length-1)*100).toFixed(2),(100-((y-mn)/sp)*88-4).toFixed(2)]);
 const d=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
 return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:112px;display:block">
  <defs><linearGradient id="g${c.slice(1)}" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="${c}" stop-opacity=".42"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
  <path d="${d} L100 100 L0 100 Z" fill="url(#g${c.slice(1)})"/>
  <path d="${d}" fill="none" stroke="${c}" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;}
function donut(cat){let a=-Math.PI/2,o='';const T=TYPES.reduce((s,x)=>s+x[1],0);
 TYPES.forEach((t,i)=>{const an=t[1]/T*Math.PI*2,b=a+an,big=an>Math.PI?1:0;
  const p=(r,x)=>[(50+r*Math.cos(x)).toFixed(2),(50+r*Math.sin(x)).toFixed(2)];
  const[x1,y1]=p(44,a),[x2,y2]=p(44,b),[x3,y3]=p(27,b),[x4,y4]=p(27,a);
  o+=`<path d="M${x1} ${y1} A44 44 0 ${big} 1 ${x2} ${y2} L${x3} ${y3} A27 27 0 ${big} 0 ${x4} ${y4} Z" fill="${cat[i]}"/>`;a=b;});
 return `<svg viewBox="0 0 100 100" style="width:104px;height:104px;flex:none">${o}</svg>`;}

function screen(t,mode,cat){
 return `<div class="phone" style="background:${t.bg};color:${t.ink}">
 <div class="tag" style="background:${t.s2};color:${t.i2}">${mode}</div>
 <div class="scr">
  <div class="hdr"><div class="av" style="background:${t.br};color:${t.brOn}">ST</div>
   <div class="greet" style="flex:1"><small>Good morning,</small><b>Sam Tan</b></div>
   <div class="ico" style="background:${t.s2}">⋮</div><div class="ico" style="background:${t.s2}">⌕</div>
   <div class="ico" style="background:${t.br};color:${t.brOn};opacity:1">+</div></div>

  <div class="hero" style="background:linear-gradient(135deg,${t.heroA},${t.heroB});color:#fff">
   <div class="lbl">Total net worth</div>
   <div class="big">$1,843,688</div>
   <span class="pill" style="background:rgba(255,255,255,.22);color:#fff">▲ +$88K · +5.01%</span>
   <div class="base">vs last quarter</div></div>

  <div class="two">
   <div class="mini" style="background:${t.s1}"><small style="color:${t.i2}">Readily accessible</small><b>$1.04M</b></div>
   <div class="mini" style="background:${t.s1}"><small style="color:${t.i2}">Liabilities</small><b style="color:${t.neg}">−$382K</b></div></div>

  <div class="card" style="background:${t.s1}">
   <div class="ch"><h3>Net worth trend</h3><span style="font-size:12px;font-weight:700;color:${t.pos}">+5.01%</span></div>
   ${area(TREND,t.br)}
   <div class="rng">${['6M','1Y','2Y','4Y','All'].map((r,i)=>`<span class="${i===1?'on':''}" style="${i===1?`background:${t.s2};color:${t.ink}`:`color:${t.i2}`}">${r}</span>`).join('')}</div></div>

  <div class="card" style="background:${t.s1}">
   <div class="ch"><h3>Allocation</h3></div>
   <div class="alloc">${donut(cat)}<div class="lg">
   ${TYPES.map((x,i)=>`<div class="lgr"><i style="background:${cat[i]}"></i><span>${x[0]}</span><b>${x[1].toFixed(1)}%</b></div>`).join('')}</div></div></div>

  <div class="rows" style="background:${t.s1}">
   ${HOLD.map((h,i)=>`<div class="row" style="${i?`border-top:1px solid ${t.line}`:''}">
    ${spark(h[6],h[3][0]==='−'||h[0]==='Toyota Corolla Altis'?t.neg:t.pos)}
    <div class="gr"><div class="nm">${h[0]}
      ${h[4]?`<span class="chip" style="background:${t.agBg};color:${t.ag}">agent</span>`:''}
      ${h[5]?`<span class="chip" style="background:${t.warnBg};color:${t.warn}">stale</span>`:''}</div>
     <div class="sb">${h[1]}</div></div>
    <div class="amt"><b>${h[2]}</b><s style="color:${h[3][0]==='−'?t.neg:h[3]==='+0.00%'?t.i2:t.pos}">${h[3]}</s></div></div>`).join('')}</div>

  <div class="cta" style="background:${t.br};color:${t.brOn}">+ Add tracking</div>

  <div class="tabs" style="border-color:${t.line}">
   ${[['⌂','Home',1],['◫','Insights',0],['◈','Agent',0],['○','Account',0]].map(x=>
    `<div class="tb" style="color:${x[2]?t.brT:t.i2}"><i>${x[0]}</i>${x[1]}</div>`).join('')}</div>
 </div></div>`;}

document.getElementById('out').innerHTML=Object.keys(P).map(k=>{const p=P[k];
 return `<div class="pal" id="pal-${k}"><h2>${p.name}</h2><p>${p.note}</p>
 <div class="pair">${screen(p.dark,'Dark',CAT_D)}${screen(p.light,'Light',CAT_L)}</div></div>`;}).join('');
</script></body></html>
